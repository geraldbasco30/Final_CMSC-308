spring:
  application:
    name: Tasky
  datasource:
    url: ${TASKY_H2_URL:jdbc:h2:file:./data/tasky;DB_CLOSE_ON_EXIT=FALSE}
    username: sa
    password: ${TASKY_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
tasky:
  setup:
    owner-token: ${TASKY_OWNER_SETUP_TOKEN:}
  registration:
    enabled: ${TASKY_REGISTRATION_ENABLED:true}
server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}
  error:
    include-message: never
    include-stacktrace: never
logging:
  level:
    org.hibernate.SQL: WARN
---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/tasky}
    username: ${DATABASE_USER:tasky}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
