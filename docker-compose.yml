services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tasky
      POSTGRES_USER: ${DATABASE_USER:-tasky}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    volumes:
      - tasky_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-tasky} -d tasky"]
      interval: 5s
      retries: 15
  app:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DATABASE_URL: jdbc:postgresql://db:5432/tasky
      DATABASE_USER: ${DATABASE_USER:-tasky}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      TASKY_OWNER_SETUP_TOKEN: ${TASKY_OWNER_SETUP_TOKEN:?Set a private setup token in .env before hosting}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
volumes:
  tasky_db:
